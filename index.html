<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вопрос</title>
    <style>
        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            overflow: hidden;
            margin: 0;
        }

        h1 {
            margin-bottom: 30px;
        }

        .buttons-container {
            display: flex;
            gap: 50px;
            align-items: center;
            height: 50px;
        }

        button {
            padding: 12px 28px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #btnYes {
            background-color: #4CAF50;
            color: white;
        }

        #btnNo {
            background-color: #f44336;
            color: white;
            position: fixed;
            transition: left 0.1s ease, top 0.1s ease;
        }

        /* Стиль для всплывающего окна с картинкой */
        .modal-overlay {
            display: none; /* Изначально скрыто */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8); /* Полупрозрачный черный фон */
            justify-content: center;
            align-items: center;
            z-index: 9999; /* Чтобы окно было поверх всего */
        }

        .modal-content {
            background-color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            max-width: 90%;
            max-height: 90%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .modal-content img {
            max-width: 100%;
            max-height: 70vh; /* Ограничение по высоте, чтобы влезало в экран */
            border-radius: 8px;
            display: block;
            margin: 0 auto 15px auto;
        }

        .modal-content p {
            font-size: 22px;
            font-weight: bold;
            margin: 0;
            color: #333;
        }
    </style>
</head>
<body>

    <h1>Айтуар Мамонт?</h1>

    <div class="buttons-container">
        <button id="btnYes">Да</button>
        <button id="btnNo" style="position: relative; left: 0; top: 0;">Нет</button>
    </div>

    <!-- Всплывающее окно (Модалка) -->
    <div id="imageModal" class="modal-overlay">
        <div class="modal-content">
            <!-- Сюда вставьте ссылку на вашу картинку вместо text/image -->
            <img src="aituarmamo.jpg" alt="Мамонт" id="resultImg">
            <p>Так и знали! 🦣</p>
        </div>
    </div>

    <script>
        const btnNo = document.getElementById('btnNo');
        const btnYes = document.getElementById('btnYes');
        const modal = document.getElementById('imageModal');

        // Функция перемещения кнопки "Нет"
        function moveButton() {
            if (btnNo.style.position === 'relative') {
                btnNo.style.position = 'fixed';
            }
            const padding = 20; 
            const maxW = window.innerWidth - btnNo.clientWidth - padding;
            const maxH = window.innerHeight - btnNo.clientHeight - padding;

            const x = Math.max(padding, Math.random() * maxW);
            const y = Math.max(padding, Math.random() * maxH);

            btnNo.style.left = `${x}px`;
            btnNo.style.top = `${y}px`;
        }

        btnNo.addEventListener('mouseover', moveButton);
        btnNo.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveButton();
        });

        // Показ картинки при клике на "Да"
        btnYes.addEventListener('click', () => {
            modal.style.display = 'flex';
        });

        // Закрыть окно с картинкой, если кликнуть на темную область вокруг неё
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.style.display = 'none';
            }
        });
    </script>

</body>
</html>
